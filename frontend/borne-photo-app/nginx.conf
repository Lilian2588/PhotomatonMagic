server {
    listen 80;
    
    # 1. SERVIR LE SITE REACT
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. PROXY VERS LE MONOLITHE (API)
    # On utilise le nom du service Docker "monolithic" au lieu de host.docker.internal
    # On enlève le slash final pour conserver le chemin complet (/api/...)
    location /api/ {
        proxy_pass http://monolithic:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Configuration pour SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # 3. ROUTE POUR L'AVATAR
    # Redirige les requêtes /avatar/... vers le backend
    location /avatar/ {
        proxy_pass http://monolithic:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
